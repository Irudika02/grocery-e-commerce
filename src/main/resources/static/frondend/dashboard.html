<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grocery Admin Dashboard</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#">🛒 Grocery Admin Dashboard</a>
    <div class="d-flex">
      <a href="login.html" class="btn btn-outline-light btn-sm">Logout</a>
    </div>
  </div>
</nav>

<div class="container">

  <!-- Analytics Cards (Orders, Revenue, Profit) -->
  <div class="row mb-4">
    <div class="col-md-4">
      <div class="card text-white bg-primary shadow-sm border-0">
        <div class="card-body">
          <h5 class="card-title">Total Orders</h5>
          <h3 id="totalOrdersCount">0</h3>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card text-white bg-success shadow-sm border-0">
        <div class="card-body">
          <h5 class="card-title">Total Revenue (Rs.)</h5>
          <h3 id="totalRevenueAmount">0.00</h3>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card text-white bg-warning shadow-sm border-0 text-dark">
        <div class="card-body">
          <h5 class="card-title">Total Profit (Rs.)</h5>
          <h3 id="totalProfitAmount">0.00</h3>
        </div>
      </div>
    </div>
  </div>

  <!-- Add Product Form Section -->
  <div class="card shadow-sm border-0 mb-4">
    <div class="card-body p-4">
      <h4 class="card-title fw-bold text-secondary mb-3">Add New Product</h4>
      <form id="productForm">
        <div class="row">
          <div class="col-md-4 mb-3">
            <label for="productName" class="form-label">Product Name</label>
            <input type="text" class="form-control" id="productName" required placeholder="උදා: කැකුළු හාල්">
          </div>
          <div class="col-md-2 mb-3">
            <label for="productWeight" class="form-label">Weight (kg/g)</label>
            <input type="number" step="any" class="form-control" id="productWeight" required placeholder="1.0">
          </div>
          <div class="col-md-2 mb-3">
            <label for="productCostPrice" class="form-label">Cost Price (Rs.)</label>
            <input type="number" step="any" class="form-control" id="productCostPrice" required placeholder="200.00">
          </div>
          <div class="col-md-2 mb-3">
            <label for="productSellingPrice" class="form-label">Selling Price (Rs.)</label>
            <input type="number" step="any" class="form-control" id="productSellingPrice" required placeholder="250.00">
          </div>
          <div class="col-md-2 mb-3">
            <label for="productStock" class="form-label">Stock Quantity</label>
            <input type="number" class="form-control" id="productStock" required placeholder="50">
          </div>
        </div>
        <button type="submit" class="btn btn-success fw-bold px-4">Save Product</button>
      </form>
    </div>
  </div>

  <!-- Available Products Section -->
  <div class="mb-5">
    <h3 class="fw-bold mb-4 text-dark">Available Grocery Products</h3>
    <div class="row" id="productList">
      <!-- Products will be loaded dynamically -->
    </div>
  </div>

</div>

<!-- Edit Product Modal -->
<div class="modal fade" id="editProductModal" tabindex="-1" aria-labelledby="editProductModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title" id="editProductModalLabel">Edit Product</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="editProductForm">
          <input type="hidden" id="editProductId">
          <div class="mb-3">
            <label class="form-label fw-bold">Product Name</label>
            <input type="text" class="form-control" id="editProductName" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold">Weight (kg/g)</label>
            <input type="number" step="any" class="form-control" id="editProductWeight" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold">Cost Price (Rs.)</label>
            <input type="number" step="any" class="form-control" id="editProductCostPrice" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold">Selling Price (Rs.)</label>
            <input type="number" step="any" class="form-control" id="editProductSellingPrice" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold">Stock Quantity</label>
            <input type="number" class="form-control" id="editProductStockQuantity" required>
          </div>
          <button type="submit" class="btn btn-success w-100 fw-bold">Update Product</button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Unified JavaScript Logic -->
<script>
  document.addEventListener("DOMContentLoaded", function() {
    loadProducts();
    loadDashboardAnalytics();

// Handle Add Product Form
    const productForm = document.getElementById('productForm');
    productForm.addEventListener('submit', function(e) {
      e.preventDefault();

      const productData = {
        name: document.getElementById('productName').value,
        weight: parseFloat(document.getElementById('productWeight').value),
        costPrice: parseFloat(document.getElementById('productCostPrice').value),
        sellingPrice: parseFloat(document.getElementById('productSellingPrice').value),
        stockQuantity: parseInt(document.getElementById('productStock').value)
      };

      fetch('http://localhost:8081/api/products', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(productData)
      })
              .then(response => {
                if (!response.ok) throw new Error('Failed to add product');
                return response.json();
              })
              .then(data => {
                alert('Product added successfully!');
                productForm.reset();
                loadProducts();
              })
              .catch(error => {
                console.error('Error:', error);
                alert('Error adding product.');
              });
    });

// Handle Edit Product Form
    document.getElementById('editProductForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const id = document.getElementById('editProductId').value;
      const updatedProduct = {
        name: document.getElementById('editProductName').value,
        weight: parseFloat(document.getElementById('editProductWeight').value),
        costPrice: parseFloat(document.getElementById('editProductCostPrice').value),
        sellingPrice: parseFloat(document.getElementById('editProductSellingPrice').value),
        stockQuantity: parseInt(document.getElementById('editProductStockQuantity').value)
      };

      fetch(`http://localhost:8081/api/products/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(updatedProduct)
      })
              .then(response => {
                if (!response.ok) throw new Error('Failed to update product');
                return response.json();
              })
              .then(data => {
                alert("Product updated successfully!");
                const modalElement = document.getElementById('editProductModal');
                const modalInstance = bootstrap.Modal.getInstance(modalElement);
                modalInstance.hide();
                loadProducts();
              })
              .catch(error => {
                console.error('Error updating product:', error);
                alert("Failed to update product.");
              });
    });
  });

  // Load All Products
  function loadProducts() {
    fetch('http://localhost:8081/api/products')
            .then(response => response.json())
            .then(products => {
              const productListDiv = document.getElementById('productList');
              productListDiv.innerHTML = '';

              if (products.length === 0) {
                productListDiv.innerHTML = '<p class="text-muted">No products available at the moment.</p>';
                return;
              }

              products.forEach(product => {
                const productCard = `
<div class="col-md-4 mb-4">
<div class="card shadow-sm border-0 h-100 rounded-3">
<div class="card-body">
<h5 class="card-title text-primary fw-bold">${product.name}</h5>
<p class="card-text text-muted mb-1">Weight: ${product.weight}</p>
<p class="card-text text-danger mb-1 small">Cost: Rs. ${product.costPrice}</p>
<h6 class="text-success fw-bold mt-1">Selling: Rs. ${product.sellingPrice}</h6>
<span class="badge bg-info text-dark mt-2">Stock: ${product.stockQuantity}</span>

<div class="mt-3 d-flex gap-2">
<button class="btn btn-warning btn-sm fw-bold w-50" onclick="openEditModal(${product.id}, '${product.name}', ${product.weight}, '${product.costPrice}', '${product.sellingPrice}', ${product.stockQuantity})">Edit</button>
<button class="btn btn-danger btn-sm fw-bold w-50" onclick="deleteProduct(${product.id})">Delete</button>
</div>
</div>
</div>
</div>
`;
                productListDiv.innerHTML += productCard;
              });
            })
            .catch(error => {
              console.error('Error fetching products:', error);
            });
  }

  // Open Edit Modal
  function openEditModal(id, name, weight, costPrice, sellingPrice, stockQuantity) {
    document.getElementById('editProductId').value = id;
    document.getElementById('editProductName').value = name;
    document.getElementById('editProductWeight').value = weight;
    document.getElementById('editProductCostPrice').value = costPrice;
    document.getElementById('editProductSellingPrice').value = sellingPrice;
    document.getElementById('editProductStockQuantity').value = stockQuantity;

    const editModal = new bootstrap.Modal(document.getElementById('editProductModal'));
    editModal.show();
  }

  // Delete Product
  function deleteProduct(id) {
    if (confirm("Are you sure you want to delete this product?")) {
      fetch(`http://localhost:8081/api/products/${id}`, {
        method: 'DELETE'
      })
              .then(response => {
                if (response.ok) {
                  alert("Product deleted successfully!");
                  loadProducts();
                } else {
                  alert("Failed to delete product.");
                }
              })
              .catch(error => {
                console.error('Error deleting product:', error);
              });
    }
  }

  // Load Analytics Data
  function loadDashboardAnalytics() {
    fetch('http://localhost:8081/api/orders')
            .then(response => response.json())
            .then(orders => {
              const totalOrders = orders.length;
              document.getElementById('totalOrdersCount').innerText = totalOrders;

              let revenue = 0;
              let profit = 0;

              orders.forEach(order => {
                revenue += order.totalPrice;
                profit += order.totalProfit;
              });

              document.getElementById('totalRevenueAmount').innerText = revenue.toFixed(2);
              document.getElementById('totalProfitAmount').innerText = profit.toFixed(2);
            })
            .catch(error => console.error('Error loading analytics:', error));
  }
</script>
</body>
</html>
