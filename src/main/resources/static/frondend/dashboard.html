<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
</head>
<body>

<h2 id="welcomeMsg">Welcome to Your Dashboard!</h2>

<!-- User Details පෙන්නන්න කොටස -->
<div id="profileDetails">
  <p><strong>Email:</strong> <span id="userEmailDisplay">Loading...</span></p>
  <p><strong>Name:</strong> <span id="userNameDisplay">Loading...</span></p>
</div>

<button id="logoutBtn">Logout</button>

<script>
  const userEmail = localStorage.getItem('loggedInUser');

  if (!userEmail) {
// Login වෙලා නැත්නම් කෙළින්ම Login page එකට redirect කිරීම
    window.location.href = 'login.html';
  } else {
// Backend එකෙන් User details ගෙන්න ගන්න Fetch Request එක
    fetch(`http://localhost:8081/api/users/profile?email=${userEmail}`)
            .then(response => {
              if (!response.ok) {
                throw new Error('Failed to fetch profile');
              }
              return response.json();
            })
            .then(user => {
// Backend එකෙන් ආපු Data HTML එකට එකතු කිරීම
              document.getElementById('welcomeMsg').innerText = `Welcome, ${user.name || user.email}!`;
              document.getElementById('userEmailDisplay').innerText = user.email;
              document.getElementById('userNameDisplay').innerText = user.name || 'N/A';
            })
            .catch(error => {
              console.error('Error:', error);
            });
  }

  // Logout Logic එක
  document.getElementById('logoutBtn').addEventListener('click', function() {
    localStorage.removeItem('loggedInUser');
    window.location.href = 'login.html';
  });
</script>
</body>
</html>
