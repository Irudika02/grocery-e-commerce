<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grocery Admin Dashboard</title>
  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Grocery Admin Dashboard</a>
  </div>
</nav>

<div class="container">

  <!-- Analytics Cards (Orders, Revenue, Profit) -->
  <div class="row mb-4">
    <div class="col-md-4">
      <div class="card text-white bg-primary shadow">
        <div class="card-body">
          <h5 class="card-title">Total Orders</h5>
          <h3 id="totalOrdersCount">0</h3>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card text-white bg-success shadow">
        <div class="card-body">
          <h5 class="card-title">Total Revenue (Rs.)</h5>
          <h3 id="totalRevenueAmount">0.00</h3>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card text-white bg-warning shadow">
        <div class="card-body">
          <h5 class="card-title">Total Profit (Rs.)</h5>
          <h3 id="totalProfitAmount">0.00</h3>
        </div>
      </div>
    </div>
  </div>

  <!-- Product Management Section (ඔයාගේ කලින් තිබුණු කොටස් මෙතැනට වැටේ) -->
  <div class="card shadow p-4">
    <h4 class="mb-3">Product Management</h4>
    <div id="productSection">
      <!-- Products Table or Forms goes here -->
    </div>
  </div>

</div>

<!-- Bootstrap JS Bundle CDN -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Custom JavaScript for Analytics -->
<script>
  // Orders, Revenue සහ Profit ගණනය කර පෙන්වීම
  function loadDashboardAnalytics() {
    fetch('http://localhost:8081/api/orders')
            .then(response => response.json())
            .then(orders => {
// Total Orders ගණන
              const totalOrders = orders.length;
              document.getElementById('totalOrdersCount').innerText = totalOrders;

              let revenue = 0;
              let profit = 0;

              orders.forEach(order => {
                revenue += order.totalPrice;
                profit += order.totalProfit;
              });

// Revenue සහ Profit ඩොට් එකෙන් පසු දශම ස්ථාන 2කට පෙන්වීම
              document.getElementById('totalRevenueAmount').innerText = revenue.toFixed(2);
              document.getElementById('totalProfitAmount').innerText = profit.toFixed(2);
            })
            .catch(error => console.error('Error loading analytics:', error));
  }

  // Page එක Load වන විට ක්‍රියාත්මක වීම
  window.onload = function() {
    if (typeof loadProducts === 'function') {
      loadProducts(); // කලින් තිබුණු ප්‍රොඩක්ට් ලෝඩ් වන ෆන්ක්ෂන් එක ඇත්නම්
    }
    loadDashboardAnalytics();
  };
</script>




<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- External JavaScript File -->
<script src="dashboard.js"></script>

</body>
</html>
