<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grocery Store - Login</title>
    <!-- Bootstrap 5 CSS link එක -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow-lg p-4 rounded-4" style="width: 100%; max-width: 400px;">
        <div class="card-body">
            <h3 class="card-title text-center text-primary fw-bold mb-4">🛒 Grocery Store</h3>
            <h5 class="text-center mb-4 text-muted">Sign In to Your Account</h5>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="email" class="form-label font-weight-bold">Email address</label>
                    <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Enter password" required>
                </div>

                <div id="message" class="mb-3 text-center fw-bold"></div>

                <button type="submit" class="btn btn-primary w-100 py-2">Login</button>
            </form>

            <div class="mt-4 text-center">
                <small class="text-muted">Don't have an account? <a href="register.html" class="text-primary text-decoration-none fw-bold">Register here</a></small>
            </div>
        </div>
    </div>
</div>

<!-- login.js එක එකතු කිරීම -->
<script src="login.js"></script>
</body>
</html>
