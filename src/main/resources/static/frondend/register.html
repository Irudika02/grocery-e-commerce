<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grocery Store - Register</title>
    <!-- Bootstrap 5 CSS link එක -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow-lg p-4 rounded-4" style="width: 100%; max-width: 450px;">
        <div class="card-body">
            <h3 class="card-title text-center text-primary fw-bold mb-2">🛒 Grocery Store</h3>
            <h5 class="text-center mb-4 text-muted">Create a New Account</h5>

            <form id="registerForm">
                <div class="mb-3">
                    <label for="name" class="form-label font-weight-bold">Full Name</label>
                    <input type="text" class="form-control" id="name" placeholder="John Doe" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Create a password" required>
                </div>

                <div id="message" class="mb-3 text-center fw-bold"></div>

                <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Register</button>
            </form>

            <div class="mt-4 text-center">
                <small class="text-muted">Already have an account? <a href="login.html" class="text-primary text-decoration-none fw-bold">Login here</a></small>
            </div>
        </div>
    </div>
</div>

<!-- script.js (register logic) එකතු කිරීම -->
<script src="script.js"></script>
</body>
</html>
