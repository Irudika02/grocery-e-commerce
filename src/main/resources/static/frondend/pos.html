<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Billing System - Grocery Store</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .product-item-card {
            cursor: pointer;
            transition: transform 0.15s ease-in-out;
        }
        .product-item-card:hover {
            transform: scale(1.03);
            border-color: #0d6efd;
        }
    </style>
</head>
<body class="bg-light">

<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" href="#">🧾 POS Billing Terminal</a>
        <div class="d-flex gap-2">
            <a href="dashboard.html" class="btn btn-outline-light btn-sm">📊 Admin Dashboard</a>
        </div>
    </div>
</nav>

<div class="container-fluid px-4">
    <div class="row">
        <!-- Left Side: Product Selection -->
        <div class="col-md-7">
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body">
                    <div class="row mb-3">
                        <div class="col-md-7 mb-2 mb-md-0">
                            <input type="text" id="posSearchInput" class="form-control" placeholder="🔍 Search product by name..." onkeyup="filterPosProducts()">
                        </div>
                        <div class="col-md-5">
                            <select id="posCategoryFilter" class="form-select" onchange="filterPosProducts()">
                                <option value="">All Categories</option>
                            </select>
                        </div>
                    </div>

                    <!-- Available Products Grid -->
                    <div class="row g-3" id="posProductGrid" style="max-height: 70vh; overflow-y: auto;">
                        <!-- Products will load dynamically -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Side: Current Bill / Cart -->
        <div class="col-md-5">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white fw-bold d-flex justify-content-between align-items-center">
                    <span>🛒 Current Bill (වත්මන් බිල්පත)</span>
                    <button class="btn btn-sm btn-light text-danger fw-bold" onclick="clearCart()">Clear Bill</button>
                </div>
                <div class="card-body">
                    <!-- Customer Name (Optional) -->
                    <div class="mb-3">
                        <label for="customerNameInput" class="form-label small fw-bold text-muted">Customer Name (Optional)</label>
                        <input type="text" id="customerNameInput" class="form-control form-control-sm" placeholder="Walk-in Customer">
                    </div>

                    <!-- Cart Table -->
                    <div class="table-responsive" style="max-height: 40vh; overflow-y: auto;">
                        <table class="table table-sm table-bordered align-middle">
                            <thead class="table-light">
                            <tr>
                                <th>Item</th>
                                <th style="width: 80px;">Qty</th>
                                <th>Price</th>
                                <th>Total</th>
                                <th></th>
                            </tr>
                            </thead>
                            <tbody id="cartTableBody">
                            <tr>
                                <td colspan="5" class="text-center text-muted py-3">No items added to bill yet.</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <hr>

                    <!-- Bill Summary -->
                    <div class="d-flex justify-content-between mb-2">
                        <span class="fw-bold">Total Items:</span>
                        <span id="billTotalItems" class="fw-bold">0</span>
                    </div>
                    <div class="d-flex justify-content-between mb-3">
                        <h4 class="fw-bold text-dark">Grand Total:</h4>
                        <h4 class="fw-bold text-success" id="billGrandTotal">Rs. 0.00</h4>
                    </div>

                    <!-- Cash & Balance Calculation -->
                    <div class="row g-2 mb-3 bg-light p-2 rounded border">
                        <div class="col-6">
                            <label class="form-label small fw-bold">Cash Given (Rs.)</label>
                            <input type="number" id="cashGivenInput" class="form-control" placeholder="0.00" onkeyup="calculateBalance()">
                        </div>
                        <div class="col-6">
                            <label class="form-label small fw-bold">Balance (ඉතිරි මුදල)</label>
                            <input type="text" id="balanceOutput" class="form-control fw-bold text-primary bg-white" value="Rs. 0.00" readonly>
                        </div>
                    </div>

                    <!-- Checkout Button -->
                    <button class="btn btn-success btn-lg w-100 fw-bold" onclick="processCheckout()">✅ Complete Bill & Print</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- POS Logic Script -->
<script src="pos.js"></script>
</body>
</html>
